name: aamotors-crm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aamotors}
      POSTGRES_USER: ${POSTGRES_USER:-aamotors}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"   # for the native dev loop; remove in production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aamotors} -d ${POSTGRES_DB:-aamotors}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-aamotors}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"        # AMQP for the native dev loop (host port only)
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672" # management UI (local only; remove in production)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # in-network addresses always win over host-published ports from .env
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/aamotors}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      MEDIA_ROOT: /app/uploads
    volumes:
      - media-data:/app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  rabbitmq-data:
  media-data:
